name: Validate 3D game
on:
  push:
    paths: ['3d/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/validate-3d.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-3d-proof
          path: test-results/
          retention-days: 14
